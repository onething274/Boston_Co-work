<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boston Co-work · locuszoom browser (MVP)</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <header>
    <div class="row">
      <h1>Locuszoom browser · 19 flip genes</h1>
      <label>Gene:
        <select id="gene-select"></select>
      </label>
      <span id="gene-info" class="muted"></span>
    </div>
    <div class="row filters">
      <label>WCC top %: <input type="number" id="wcc-pct" min="0" max="100" step="1" value="100"></label>
      <label>WCC padj ≤ <input type="number" id="wcc-padj" min="0" max="1" step="0.01" value="1"></label>
      <span class="sep">·</span>
      <label>DAR top %: <input type="number" id="dar-pct" min="0" max="100" step="1" value="100"></label>
      <label>DAR p_val_adj ≤ <input type="number" id="dar-padj" min="0" max="1" step="0.01" value="1"></label>
      <button id="reset-filters" type="button">reset</button>
      <span id="filter-info" class="muted"></span>
    </div>
    <div class="row">
      <span class="muted">
        Track order (top → bottom): GWAS eGFR · DAP PIP + coloc SCP · DAR log2FC (per CT strip) ·
        WCC cor (per CT strip) · Gene model.
        Pan/zoom via Plotly toolbar. Hover for values. Filter above; 100 / 1 = no filter.
      </span>
    </div>
  </header>
  <main>
    <div id="plot"></div>
  </main>
  <script src="browser.js?v=3"></script>
</body>
</html>
